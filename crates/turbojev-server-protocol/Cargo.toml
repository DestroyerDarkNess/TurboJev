[package]
name = "turbojev-server-protocol"
description = "Portable HTTP-facing protocol and batching semantics for TurboJev servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
turbojev-schema = { version = "=0.28.5", path = "../turbojev-schema" }
turbojev-server-execution = { version = "=0.28.5", path = "../turbojev-server-execution" }
turbojev-wire = { version = "=0.28.5", path = "../turbojev-wire" }
turbojev-compat = { version = "=0.28.5", path = "../turbojev-compat" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
