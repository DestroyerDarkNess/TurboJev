[package]
name = "turbojev-host-native"
description = "Shared native host/session layer for TurboJev language bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
llamacpp = ["dep:turbojev-runtime-llamacpp", "turbojev-runtime-llamacpp/ffi"]

[dependencies]
turbojev = { version = "=0.33.1", path = "../turbojev" }
turbojev-schema = { version = "=0.33.1", path = "../turbojev-schema" }
turbojev-wire = { version = "=0.33.1", path = "../turbojev-wire" }
turbojev-compat = { version = "=0.33.1", path = "../turbojev-compat" }
turbojev-engine = { version = "=0.33.1", path = "../turbojev-engine" }
turbojev-backend = { version = "=0.33.1", path = "../turbojev-backend" }
turbojev-backend-mock = { version = "=0.33.1", path = "../turbojev-backend-mock" }
turbojev-runtime = { version = "=0.33.1", path = "../turbojev-runtime" }
turbojev-runtime-qualification = { version = "=0.33.1", path = "../turbojev-runtime-qualification" }
turbojev-runtime-llamacpp = { version = "=0.33.1", path = "../turbojev-runtime-llamacpp", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
indexmap.workspace = true

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
