[package]
name = "turbojev-jni"
description = "Android JNI binding over TurboJev host-native sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
llamacpp = ["turbojev-host-native/llamacpp"]

[dependencies]
turbojev-host-native = { path = "../turbojev-host-native" }
jni = "=0.21.1"

[lints.rust]
rust_2018_idioms = "deny"
unsafe_op_in_unsafe_fn = "deny"
