[package]
name = "turbojev-runtime-llamacpp"
description = "Optional cross-platform llama.cpp/GGUF reference runtime adapter for TurboJev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Links to the stable TurboJev C shim. The shim itself is built against llama.cpp
# outside the portable core and can be compiled on any platform supported by llama.cpp.
ffi = []

[dependencies]
turbojev-backend = { version = "=0.33.0", path = "../turbojev-backend" }
turbojev-prompt = { version = "=0.33.0", path = "../turbojev-prompt" }
turbojev-runtime = { version = "=0.33.0", path = "../turbojev-runtime" }
turbojev-schema = { version = "=0.33.0", path = "../turbojev-schema" }
turbojev-sequence = { version = "=0.33.0", path = "../turbojev-sequence" }
thiserror.workspace = true
serde_json.workspace = true

[dev-dependencies]
turbojev = { version = "=0.33.0", path = "../turbojev" }
turbojev-runtime-conformance = { version = "=0.33.0", path = "../turbojev-runtime-conformance" }
turbojev-tokenizer = { version = "=0.33.0", path = "../turbojev-tokenizer" }

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "reference_gguf"
required-features = ["ffi"]

[[example]]
name = "shared_prefix_gguf"
required-features = ["ffi"]

[[example]]
name = "parallel_suffix_gguf"
required-features = ["ffi"]

[[example]]
name = "real_fused_qualification"
required-features = ["ffi"]

[[example]]
name = "multimodal_gguf"
required-features = ["ffi"]
