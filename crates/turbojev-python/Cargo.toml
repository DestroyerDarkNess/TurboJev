[package]
name = "turbojev-python"
description = "PyO3 native extension for TurboJev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = ["abi3"]
abi3 = ["pyo3/abi3-py39", "pyo3/generate-import-lib"]
llamacpp = ["turbojev-host-native/llamacpp"]

[dependencies]
turbojev-host-native = { version = "=0.30.1", path = "../turbojev-host-native" }
pyo3 = { version = "=0.23.4", features = ["extension-module"] }

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
