[package]
name = "turbojev-wasm"
description = "TurboJev browser/WASM host binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
turbojev = { version = "=0.30.0", path = "../turbojev" }
turbojev-runtime = { version = "=0.30.0", path = "../turbojev-runtime" }
turbojev-prompt = { version = "=0.30.0", path = "../turbojev-prompt" }
turbojev-backend = { version = "=0.30.0", path = "../turbojev-backend" }
turbojev-engine = { version = "=0.30.0", path = "../turbojev-engine" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
serde-wasm-bindgen = "=0.6.5"

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
