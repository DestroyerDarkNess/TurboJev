name: ci

on:
  push:
  pull_request:

jobs:
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - name: Structural validation
        run: python scripts/check_structure.py
      - name: Dependency graph
        run: python scripts/check_dependency_graph.py
      - name: Rust source sanity
        run: python scripts/check_rust_sources.py
      - name: Portability audit
        run: python scripts/audit_portability.py
      - name: Compatibility golden fixtures
        run: python scripts/check_compat_fixtures.py
      - name: Calibration fixtures
        run: python scripts/check_calibration_fixtures.py
      - name: Specialized-model fixtures
        run: python scripts/check_specialized_fixtures.py
      - name: Specialized evaluation fixtures
        run: python scripts/check_specialized_evaluation.py
      - name: Server fixtures
        run: python scripts/check_server_fixtures.py
      - name: Runtime qualification fixtures
        run: python scripts/check_runtime_qualification.py
      - name: Cross-language E2E fixtures
        run: python scripts/check_e2e_fixtures.py
      - name: Native architecture packaging guards
        run: python -m unittest discover -s tests/compat -p "test_*.py"
      - name: Source manifest
        run: python scripts/source_manifest.py
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  wasm-portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and execute generic WASM media protocol
        run: |
          cargo build -p turbojev-wasm --target wasm32-unknown-unknown --locked
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          wasm-bindgen target/wasm32-unknown-unknown/debug/turbojev_wasm.wasm --target nodejs --out-dir .cache/multimodal-wasm
          node scripts/test_wasm_media.cjs .cache/multimodal-wasm/turbojev_wasm.js
      - name: Dependency graph
        run: python scripts/check_dependency_graph.py
      - name: Rust source sanity
        run: python scripts/check_rust_sources.py
      - name: Portability audit
        run: python scripts/audit_portability.py
      - name: Compatibility golden fixtures
        run: python scripts/check_compat_fixtures.py
      - name: Source manifest
        run: python scripts/source_manifest.py
      - name: Check portable crates for wasm32
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p turbojev-schema
          -p turbojev-calibration
          -p turbojev-tokenizer
          -p turbojev-prompt
          -p turbojev-model
          -p turbojev-specialized
          -p turbojev-training-data
          -p turbojev-specialized-artifact
          -p turbojev-specialized-eval
          -p turbojev-server-protocol
          -p turbojev-server-execution
          -p turbojev-backend
          -p turbojev-engine
          -p turbojev-core
          -p turbojev-wire
          -p turbojev-backend-mock
          -p turbojev-backend-custom
          -p turbojev-compat
          -p turbojev-conformance
          -p turbojev-runtime
          -p turbojev-sequence
          -p turbojev-runtime-conformance
          -p turbojev-runtime-qualification
          -p turbojev-projection
          -p turbojev-runtime-projection
          -p turbojev-benchmark
          -p turbojev

  native-shim-and-c-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native llama.cpp shim smoke
        run: python scripts/check_native_shims.py
      - name: C11 public header smoke
        run: cc -std=c11 -Wall -Wextra -Werror -Ibindings/c/include -c bindings/c/smoke.c -o /tmp/turbojev-c-smoke.o
      - name: Binding structure
        run: python scripts/check_bindings.py

  javascript-bindings:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '22', '24']
        package:
          - bindings/node
          - bindings/web
          - bindings/web-runtimes/transformersjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install package dependencies
        working-directory: ${{ matrix.package }}
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build
        working-directory: ${{ matrix.package }}
        run: npm run build
      - name: Tests
        working-directory: ${{ matrix.package }}
        run: npm test
      - name: Package dry run
        working-directory: ${{ matrix.package }}
        run: npm pack --dry-run

  python-wrapper:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Thin wrapper tests
        working-directory: bindings/python
        run: pytest -q

  dotnet-binding:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build all managed compatibility targets
        run: dotnet build bindings/dotnet/TurboJev/TurboJev.csproj -c Release

  swift-binding:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - name: Build C ABI for real fixture calls
        run: cargo build --locked -p turbojev-capi
      - name: Build Swift package surface
        working-directory: bindings/swift
        run: swift build
      - name: Verify Swift native errors and fixture contracts
        working-directory: bindings/swift
        run: swift test -Xlinker -L${{ github.workspace }}/target/debug -Xlinker -rpath -Xlinker ${{ github.workspace }}/target/debug

  android-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and lint source binding
        working-directory: bindings/android
        run: gradle --no-daemon assembleDebug lintDebug
