name: native-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - rid: linux-x86
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_i686
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build complete native runtime and wheel
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e RID=${{ matrix.rid }} ${{ matrix.image }} \
            bash scripts/build-manylinux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/unix/${{ matrix.rid }}/native/
            artifacts/unix/${{ matrix.rid }}/node/
            artifacts/unix/${{ matrix.rid }}/wheels/
            artifacts/unix/${{ matrix.rid }}/*smoke.json
            artifacts/unix/${{ matrix.rid }}/build-evidence.json
          if-no-files-found: error
          retention-days: 14

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install packaging tools
        run: python -m pip install maturin==1.9.6 cmake ninja
      - name: Build complete native runtime and wheel
        run: python scripts/build-native-unix.py ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: |
            artifacts/unix/${{ matrix.rid }}/native/
            artifacts/unix/${{ matrix.rid }}/node/
            artifacts/unix/${{ matrix.rid }}/wheels/
            artifacts/unix/${{ matrix.rid }}/*smoke.json
            artifacts/unix/${{ matrix.rid }}/build-evidence.json
          if-no-files-found: error
          retention-days: 14
