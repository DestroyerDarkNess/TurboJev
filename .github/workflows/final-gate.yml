name: turbojev-final-gate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v0.28.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          cat bootstrap/chunk_*.txt > /tmp/turbojev-source.b64
          base64 --decode /tmp/turbojev-source.b64 > /tmp/turbojev-source.tar.xz
          echo "3b6553c0be41a06a8a1cb475fdcc8c8ff48c54abf92b87714b57eb3333bcfb09  /tmp/turbojev-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/turbojev-source.tar.xz --strip-components=1 -C source
          cd source
          sha256sum -c SOURCE_MANIFEST.sha256

      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Python validation dependencies
        run: python -m pip install jsonschema

      - name: Locked workspace gates + real model + fused qualification + language parity
        working-directory: source
        run: >-
          python scripts/final_e2e_linux.py
          --work-dir .e2e-final
          --report artifacts/final-validation-report.json

      - name: Validate final reports
        working-directory: source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path('.')
          pairs=[
              (root/'tests/e2e/final-plan.json', root/'schemas/turbojev.final-e2e-plan.schema.json'),
              (root/'.e2e-final/e2e-language-report.json', root/'schemas/turbojev.e2e-language-report.schema.json'),
              (root/'artifacts/final-validation-report.json', root/'schemas/turbojev.final-validation-report.schema.json'),
              (root/'.e2e-final/runtime-qualification.json', root/'schemas/turbojev.runtime-qualification.schema.json'),
          ]
          for document, schema in pairs:
              errors=list(Draft202012Validator(json.loads(schema.read_text())).iter_errors(json.loads(document.read_text())))
              if errors:
                  raise SystemExit(f'{document}: ' + '; '.join(e.message for e in errors))
          print('final real-model report schemas PASS')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbojev-real-e2e
          if-no-files-found: warn
          path: |
            source/artifacts/final-validation-report.json
            source/.e2e-final/qualification-evidence.json
            source/.e2e-final/runtime-fingerprint.json
            source/.e2e-final/runtime-qualification.json
            source/.e2e-final/e2e-language-report.json
            source/.e2e-final/dependency-locks/Cargo.lock
            source/.e2e-final/dependency-locks/node-package-lock.json
