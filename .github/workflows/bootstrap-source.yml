name: bootstrap-source-tree

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify TurboJev v0.28.2 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_*.b64 > /tmp/turbojev.tar.xz.b64
          base64 -d /tmp/turbojev.tar.xz.b64 > /tmp/turbojev.tar.xz
          echo "3b6553c0be41a06a8a1cb475fdcc8c8ff48c54abf92b87714b57eb3333bcfb09  /tmp/turbojev.tar.xz" | sha256sum -c -
          mkdir -p /tmp/turbojev-src
          tar -xJf /tmp/turbojev.tar.xz -C /tmp/turbojev-src
          test -f /tmp/turbojev-src/TurboJev/SOURCE_MANIFEST.sha256
          cd /tmp/turbojev-src/TurboJev
          sha256sum -c SOURCE_MANIFEST.sha256

      - name: Replace bootstrap with complete source tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git/' /tmp/turbojev-src/TurboJev/ ./
          git config user.name "TurboJev Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import TurboJev v0.28.2 complete source tree"
          git push origin HEAD:main
