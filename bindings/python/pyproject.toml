[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "turbojev"
version = "0.31.0"
description = "TurboJev native semantic decision engine"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "TurboJev contributors" }]
readme = "../../README.md"
homepage = "https://github.com/DestroyerDarkNess/TurboJev"
repository = "https://github.com/DestroyerDarkNess/TurboJev"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[tool.maturin]
manifest-path = "../../crates/turbojev-python/Cargo.toml"
python-source = "."
module-name = "turbojev._native"
features = []

[tool.pytest.ini_options]
pythonpath = ["."]
