[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "turbojev"
version = "0.28.2"
description = "TurboJev native semantic decision engine"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "../../crates/turbojev-python/Cargo.toml"
python-source = "."
module-name = "turbojev._native"
features = []

[tool.pytest.ini_options]
pythonpath = ["."]
